<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cosmic Creative AI</title>

<style>
:root {
  --bg: #0b0f1a;
  --glass: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.15);
  --accent: #7f9cff;
  --accent2: #9f7bff;
  --text: #e5e7eb;
  --muted: #9ca3af;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: radial-gradient(circle at top, #11183a, #05070f);
  color: var(--text);
  padding: 20px;
}

.container {
  max-width: 1200px;
  margin: auto;
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 24px;
}

@media (max-width: 900px) {
  .container {
    grid-template-columns: 1fr;
  }
}

.card {
  background: var(--glass);
  backdrop-filter: blur(18px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

h1, h2 {
  margin: 0 0 10px;
  font-weight: 700;
}

.subtitle {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 20px;
}

label {
  font-size: 12px;
  color: var(--muted);
}

input, textarea, select {
  width: 100%;
  margin-top: 6px;
  margin-bottom: 14px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  color: var(--text);
  outline: none;
}

textarea { resize: vertical; }

input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
}

.btn {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  font-weight: 600;
  color: white;
  cursor: pointer;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  transition: transform .2s, box-shadow .2s;
}

.btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 15px 40px rgba(127,156,255,0.5);
}

.btn:disabled { opacity: .6; cursor: not-allowed; }

.toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.drop {
  border: 2px dashed var(--border);
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: border .2s, background .2s;
}

.drop.dragover {
  background: rgba(127,156,255,0.15);
  border-color: var(--accent);
}

.preview {
  margin-top: 12px;
  border-radius: 14px;
  max-height: 220px;
  object-fit: contain;
  width: 100%;
}

.slider {
  margin-top: 10px;
  background: rgba(255,255,255,0.04);
  padding: 12px;
  border-radius: 14px;
  font-size: 12px;
}

.result-img {
  width: 100%;
  border-radius: 18px;
  margin-bottom: 14px;
}

.meta {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  font-size: 13px;
}

.meta div {
  background: rgba(255,255,255,0.05);
  padding: 10px;
  border-radius: 12px;
}

.hidden { display: none; }

.loader {
  width: 56px;
  height: 56px;
  border: 4px solid rgba(255,255,255,0.2);
  border-top: 4px solid var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 30px auto;
}

@keyframes spin { to { transform: rotate(360deg); } }

.footer {
  margin-top: 18px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
}
</style>
</head>

<body>

<div class="container">

<!-- INPUT -->
<div class="card">
  <h1>🌌 Cosmic Creative AI</h1>
  <div class="subtitle">Futuristic AI-powered marketing creatives</div>

  <form id="form">

    <label>Product Name</label>
    <input id="product" required>

    <label>Description</label>
    <textarea id="desc" required></textarea>

    <label>Audience</label>
    <input id="audience" required>

    <label>Platform</label>
    <select id="platform" required>
      <option>Instagram</option>
      <option>Facebook</option>
      <option>Website Banner</option>
    </select>

    <label>Enhanced Prompt</label>
    <textarea id="prompt" readonly></textarea>

    <div class="toggle">
      <input type="checkbox" id="useImage">
      <span>Use existing image</span>
    </div>

    <div id="imgBox" class="hidden">
      <div class="drop" id="drop">Drop image or click</div>
      <input type="file" id="file" accept="image/*" hidden>
      <img id="preview" class="preview hidden">

      <div class="slider">
        Image influence: <b><span id="strengthVal">0.6</span></b>
        <input type="range" id="strength" min="0" max="1" step="0.05" value="0.6">
      </div>
    </div>

    <button class="btn" id="submit">Generate</button>
  </form>

  <div id="loading" class="hidden">
    <div class="loader"></div>
    <div style="text-align:center;">Generating creative…</div>
  </div>
</div>

<!-- OUTPUT -->
<div class="card">
  <h2>🖼 Result</h2>
  <div id="placeholder">Your AI creative will appear here</div>

  <div id="result" class="hidden">
    <img id="outImg" class="result-img">
    <div class="meta">
      <div id="mProduct"></div>
      <div id="mPlatform"></div>
      <div id="mAudience"></div>
    </div>
    <button class="btn" id="download" style="margin-top:14px;">Download</button>
  </div>
</div>

</div>

<div class="footer">Powered by Make + FLUX + Gemini</div>

<script>
const WEBHOOK = "https://hook.us2.make.com/3hpnhs10brzci9n5ln6okkoq4mjec9wj"; // keep async

const form = document.getElementById("form");
const product = document.getElementById("product");
const desc = document.getElementById("desc");
const audience = document.getElementById("audience");
const platform = document.getElementById("platform");
const prompt = document.getElementById("prompt");

const useImage = document.getElementById("useImage");
const imgBox = document.getElementById("imgBox");
const drop = document.getElementById("drop");
const file = document.getElementById("file");
const preview = document.getElementById("preview");
const strength = document.getElementById("strength");
const strengthVal = document.getElementById("strengthVal");

const loading = document.getElementById("loading");
const result = document.getElementById("result");
const placeholder = document.getElementById("placeholder");
const outImg = document.getElementById("outImg");

const mProduct = document.getElementById("mProduct");
const mPlatform = document.getElementById("mPlatform");
const mAudience = document.getElementById("mAudience");

function enhancePrompt() {
  prompt.value =
    `Ultra-realistic professional marketing photography of ${product.value}. ` +
    `${desc.value}. Designed for ${platform.value}. ` +
    `Targeting ${audience.value}. Premium lighting, clean composition, cinematic quality.`;
}
["input","change"].forEach(evt=>{
  product.addEventListener(evt, enhancePrompt);
  desc.addEventListener(evt, enhancePrompt);
  audience.addEventListener(evt, enhancePrompt);
  platform.addEventListener(evt, enhancePrompt);
});

useImage.onchange = ()=> imgBox.classList.toggle("hidden", !useImage.checked);
strength.oninput = ()=> strengthVal.textContent = strength.value;

drop.onclick = ()=> file.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("dragover"); };
drop.ondragleave = ()=> drop.classList.remove("dragover");
drop.ondrop = e => {
  e.preventDefault();
  drop.classList.remove("dragover");
  file.files = e.dataTransfer.files;
  loadPreview();
};
file.onchange = loadPreview;

function loadPreview() {
  const f = file.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    preview.src = e.target.result;
    preview.classList.remove("hidden");
  };
  r.readAsDataURL(f);
}

form.onsubmit = async e => {
  e.preventDefault();
  loading.classList.remove("hidden");

  const payload = {
    enhanced_prompt: prompt.value,
    product_name: product.value,
    audience: audience.value,
    platform: platform.value,
    image_base64: useImage.checked ? preview.src : null,
    image_strength: strength.value
  };

  try {
    const res = await fetch(WEBHOOK, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    outImg.src = data.image_url;
    mProduct.textContent = product.value;
    mPlatform.textContent = platform.value;
    mAudience.textContent = audience.value;

    placeholder.style.display = "none";
    result.classList.remove("hidden");
  } finally {
    loading.classList.add("hidden");
  }
};

document.getElementById("download").onclick = ()=>{
  const a = document.createElement("a");
  a.href = outImg.src;
  a.download = "creative.png";
  a.click();
};
</script>

</body>
</html>
